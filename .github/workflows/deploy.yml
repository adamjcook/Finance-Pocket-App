name: Deploy to GitHub Pages

# Deploys the production build to https://adamjcook.github.io/Finance-Pocket-App/
# on every push to main. The `develop` dev-build variant is no longer deployed
# from here — see adamjcook/Finance-Pocket-App-dev, which builds this repo's
# `develop` branch and publishes it to its own sibling Pages site instead (a
# PWA's `scope` made a nested /dev/ sub-path here get swallowed by the real
# app's "already installed" check).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on first run, so no manual
          # Settings -> Pages step is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
