<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- "Two of us": two circles, one bright overlap where the money is shared.
       The lens is drawn explicitly (screen-blend of the two fills) so the mark
       renders identically in every context, favicons included. -->
  <rect width="512" height="512" rx="116" fill="#101418"/>
  <circle cx="190" cy="256" r="118" fill="#4fd1a5"/>
  <circle cx="322" cy="256" r="118" fill="#f2a65a"/>
  <path d="M256,158.2 A118,118 0 0 0 256,353.8 A118,118 0 0 0 256,158.2 Z" fill="#f7ef8a"/>
</svg>
