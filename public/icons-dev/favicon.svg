<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dev build: the production mark plus a "DEV" band in the in-app DEV BUILD
       banner's yellow, so the installed dev app can't be mistaken for the real
       one. The band sits inside the maskable safe zone once scaled. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#101418"/>
    <circle cx="190" cy="256" r="118" fill="#4fd1a5"/>
    <circle cx="322" cy="256" r="118" fill="#f2a65a"/>
    <path d="M256,158.2 A118,118 0 0 0 256,353.8 A118,118 0 0 0 256,158.2 Z" fill="#f7ef8a"/>
    <rect y="334" width="512" height="108" fill="#e0b400"/>
    <text x="256" y="414" text-anchor="middle" fill="#1b1400"
          font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800"
          letter-spacing="10">DEV</text>
  </g>
</svg>
