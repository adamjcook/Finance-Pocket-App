<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0e0c" />
    <link rel="icon" href="./%VITE_ICON_DIR%/favicon.svg" type="image/svg+xml" />
    <title>%VITE_APP_LABEL%</title>
    <script>
      // Apply the theme saved by the app before first paint (see src/app.tsx).
      try {
        if (localStorage.getItem('finpair-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f0f4f2');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
